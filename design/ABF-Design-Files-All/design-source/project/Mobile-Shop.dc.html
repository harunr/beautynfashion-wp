<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shop Skincare (Mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F1219;text-decoration:none}a:hover{color:#C8325F}
.ab{font-family:'DM Sans',system-ui,sans-serif;color:#1F1219;background:#fff;-webkit-font-smoothing:antialiased}
.d{font-family:'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-0.03em;font-weight:700}
.s{font-family:'Instrument Serif',Georgia,serif;font-style:italic;font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:50px;padding:0 22px;border-radius:999px;background:#1F1219;color:#fff;font:600 15px/1 'DM Sans',sans-serif;border:0;cursor:pointer;text-decoration:none;box-sizing:border-box}
.btn.ghost{background:transparent;color:#1F1219;box-shadow:inset 0 0 0 1.5px #1F1219}
.icb{width:44px;height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;color:#1F1219;cursor:pointer;position:relative;padding:0}
.pill{display:inline-flex;align-items:center;height:38px;padding:0 16px;border-radius:999px;border:1px solid #EADBE0;font:500 14px 'DM Sans',sans-serif;background:#fff;color:#1F1219;cursor:pointer;white-space:nowrap;flex:none}
.pill.on{background:#1F1219;color:#fff;border-color:#1F1219}
.ph{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:18px}
.badge{position:absolute;left:8px;top:8px;height:22px;padding:0 8px;border-radius:999px;background:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center;color:#1F1219}
.badge.sale{background:#C8325F;color:#fff}
.mut{color:#6E5A63}
.stars{color:#C8325F}
.price{font-weight:700;font-size:15px}
.was{text-decoration:line-through;color:#7A6570;font-size:13px}
.fl{color:#E6D3DA;font-size:14px}
.half{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border:1px solid #EADBE0;border-radius:999px;background:#fff;font:600 14px 'DM Sans',sans-serif;color:#1F1219;cursor:pointer}
</style>
</helmet>
<div class="ab" style="width: 390px; height: 2060px; display: flex; flex-direction: column; overflow: hidden">

<div style="background: #3A1830; color: #fff; height: 32px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 500">Free shipping on orders over $50</div>
<header style="height: 60px; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 8px; background: #fff">
<div style="display: flex"><a class="icb" href="Mobile-Menu.dc.html" aria-label="Open menu"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"></path></svg></a><button class="icb" aria-label="Search"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg></button></div>
<a href="Mobile-Home.dc.html" aria-label="ABeauty and Fashion home"><img src="/_blob/c27a0df3d15979b74bbdb4201970bba0" alt="ABeauty &amp; Fashion" style="height: 36px; display: block"></a>
<div style="display: flex; justify-content: flex-end">
<a class="icb" href="Desktop-Account.dc.html" aria-label="Wishlist"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></a>
<a class="icb" href="Mobile-Cart.dc.html" aria-label="Bag, 2 items"><svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M5 8h14l-1 12H6z"></path><path d="M9 8V6a3 3 0 0 1 6 0v2"></path></svg><span style="position: absolute; top: 4px; right: 2px; min-width: 18px; height: 18px; border-radius: 999px; background: #C8325F; color: #fff; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center">2</span></a>
</div>
</header>

<section style="background: #FCEEF1; padding: 20px 16px 22px; display: flex; flex-direction: column; gap: 10px">
<nav aria-label="Breadcrumb" class="mut" style="font-size: 13px; display: flex; gap: 6px"><a href="Mobile-Home.dc.html" class="mut">Home</a><span aria-hidden="true">/</span><span style="color: #1F1219; font-weight: 600">Skincare</span></nav>
<h1 class="d" style="margin: 0; font-size: 44px; line-height: 1">Skin<span class="s" style="color: #C8325F">care</span></h1>
<div style="display: flex; gap: 8px; overflow-x: auto; margin: 6px -16px 0; padding: 0 16px"><button class="pill on">All</button><button class="pill">Cleansers</button><button class="pill">Serums</button><button class="pill">Moisturisers</button><button class="pill">Masks</button></div>
</section>

<div style="position: sticky; top: 0; z-index: 2; background: #fff; padding: 12px 16px; display: flex; gap: 10px; border-bottom: 1px solid #F1E4E8">
<button class="half"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Filter <span style="min-width: 20px; height: 20px; border-radius: 999px; background: #C8325F; color: #fff; font-size: 11px; display: inline-flex; align-items: center; justify-content: center">2</span></button>
<button class="half">Sort: Popular<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>

<section style="padding: 16px 16px 0">
<p class="mut" style="margin: 0 0 14px; font-size: 13px">48 products</p>
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 12px">
<sc-for list="{{items}}" as="p" hint-placeholder-count="8">
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="ph" style="aspect-ratio: 4/5; background: {{p.tint}}">
<a href="Mobile-Product.dc.html" aria-label="{{p.name}}" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: center"><svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#8C6676" stroke-width="1" aria-hidden="true"><rect x="10" y="2" width="4" height="3" rx=".5"></rect><path d="M9 5h6v1.5c1.2.6 2 1.8 2 3.2V20a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2V9.7c0-1.4.8-2.6 2-3.2z"></path><path d="M7 12h10M7 17h10"></path></svg></a>
<sc-if value="{{p.hasBadge}}" hint-placeholder-val="{{true}}"><span class="{{p.badgeClass}}">{{p.badge}}</span></sc-if>
<button class="icb" aria-label="Add to wishlist" style="position: absolute; right: 4px; top: 4px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" aria-hidden="true"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z"></path></svg></button>
<button class="icb" aria-label="Quick add to bag" style="position: absolute; right: 6px; bottom: 6px; background: #1F1219; color: #fff"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
</div>
<div>
<div class="mut" style="font-size: 12px; margin-bottom: 2px">{{p.cat}}</div>
<a href="Mobile-Product.dc.html" style="font-weight: 600; font-size: 14px; line-height: 1.3">{{p.name}}</a>
<div style="display: flex; align-items: center; justify-content: space-between; margin-top: 6px">
<div style="display: flex; gap: 6px; align-items: baseline"><span class="price">{{p.price}}</span><sc-if value="{{p.hasWas}}" hint-placeholder-val="{{false}}"><span class="was">{{p.was}}</span></sc-if></div>
<span style="font-size: 12px; font-weight: 600"><span class="stars" aria-hidden="true">★</span> {{p.rating}}</span>
</div>
</div>
</div>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 36px 0 48px">
<span class="mut" style="font-size: 13px">Showing 8 of 48</span>
<div style="width: 200px; height: 4px; border-radius: 4px; background: #F1E4E8"><div style="width: 17%; height: 100%; background: #1F1219; border-radius: 4px"></div></div>
<button class="btn ghost" style="width: 100%">Load more</button>
</div>
</section>

<footer style="margin-top: auto; background: #2A1220; color: #F5E9ED; padding: 28px 16px; display: flex; flex-direction: column; gap: 14px">
<span class="d" style="font-size: 22px; color: #fff">ABeauty <span class="s" style="color: #F4A9C0">&amp;</span> Fashion</span>
<div style="display: flex; gap: 18px; flex-wrap: wrap"><a class="fl" href="Mobile-Home.dc.html">Shipping</a><a class="fl" href="Mobile-Home.dc.html">Returns</a><a class="fl" href="Mobile-Home.dc.html">Contact</a><a class="fl" href="Mobile-Home.dc.html">Privacy</a><a class="fl" href="Mobile-Home.dc.html">Terms</a></div>
<span style="font-size: 12px; color: #D9C3CC">© 2026 ABeauty &amp; Fashion</span>
</footer>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":2060}}'>
class Component extends DCLogic {
  renderVals() {
    const P = [
      ['Rose Dew Hydrating Serum','Serum','$28','','4.9','#FBE4EA','Bestseller'],
      ['Gentle Amino Foam Cleanser','Cleanser','$18','','4.7','#E2EEE5',''],
      ['Barrier Repair Night Cream','Moisturiser','$32','','4.8','#ECE4F6','New'],
      ['Vitamin C Brightening Drops','Serum','$26','$32','4.6','#FAF0D4','Sale'],
      ['Hyaluronic Water Gel','Moisturiser','$24','','4.7','#E2ECF6',''],
      ['Rice Enzyme Exfoliating Powder','Exfoliator','$21','','4.5','#F1E8DF',''],
      ['Daily Dewy Sunscreen SPF 50','Sunscreen','$22','','4.8','#FCE6D9','Bestseller'],
      ['Overnight Sleeping Mask','Mask','$27','','4.7','#F6D7E0','New']
    ].map(([name,cat,price,was,rating,tint,badge]) => ({ name, cat, price, was, hasWas: !!was, rating, tint, badge, hasBadge: !!badge, badgeClass: badge === 'Sale' ? 'badge sale' : 'badge' }));
    return { items: P };
  }
}
</script>
</body>
</html>
