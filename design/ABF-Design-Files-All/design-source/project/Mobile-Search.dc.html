<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Search results (Mobile)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&amp;family=DM+Sans:wght@400;500;600;700&amp;family=Instrument+Serif:ital@0;1&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1F1219;text-decoration:none}
.ab{font-family:'DM Sans',system-ui,sans-serif;color:#1F1219;background:#fff;-webkit-font-smoothing:antialiased}
.d{font-family:'Bricolage Grotesque',system-ui,sans-serif;letter-spacing:-0.03em;font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;height:50px;padding:0 20px;border-radius:999px;background:transparent;color:#1F1219;box-shadow:inset 0 0 0 1.5px #1F1219;font:600 15px/1 'DM Sans',sans-serif;border:0;box-sizing:border-box}
.icb{width:44px;height:44px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;background:transparent;border:0;color:#1F1219;position:relative;padding:0;cursor:pointer}
.pill{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:999px;border:1px solid #EADBE0;font:500 13px 'DM Sans',sans-serif;background:#fff;color:#1F1219;white-space:nowrap;flex:none;cursor:pointer}
.pill.on{background:#1F1219;color:#fff;border-color:#1F1219}
.half{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border:1px solid #EADBE0;border-radius:999px;background:#fff;font:600 14px 'DM Sans',sans-serif;color:#1F1219;cursor:pointer}
.ph{position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;border-radius:18px}
.badge{position:absolute;left:8px;top:8px;height:22px;padding:0 8px;border-radius:999px;background:#fff;font-size:11px;font-weight:700;display:inline-flex;align-items:center}
.badge.sale{background:#C8325F;color:#fff}
.mut{color:#6E5A63}
.price{font-weight:700;font-size:15px}
.was{text-decoration:line-through;color:#7A6570;font-size:13px}
.stars{color:#C8325F}
mark{background:#FBE4EA;color:inherit;border-radius:3px;padding:0 2px}
</style>
</helmet>
<div class="ab" style="width: 390px; height: 1460px; display: flex; flex-direction: column; overflow: hidden">

<header style="height: 64px; display: flex; align-items: center; gap: 6px; padding: 0 12px 0 4px; border-bottom: 1px solid #F1E4E8">
<a class="icb" href="Mobile-Home.dc.html" aria-label="Back"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 6-6 6 6 6"></path></svg></a>
<form role="search" style="flex: 1; display: flex; align-items: center; gap: 8px; height: 46px; padding: 0 6px 0 14px; border-radius: 999px; box-shadow: 0 0 0 2px #1F1219">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
<input aria-label="Search" value="serum" style="flex: 1; min-width: 0; border: 0; outline: 0; font: 500 16px 'DM Sans', sans-serif; background: transparent">
<button type="button" class="icb" aria-label="Clear search" style="width: 34px; height: 34px"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"></path></svg></button>
</form>
</header>

<div style="padding: 14px 16px 0; display: flex; flex-direction: column; gap: 12px">
<h1 class="d" style="margin: 0; font-size: 26px">“serum” <span class="mut" style="font-size: 15px; font-weight: 500; letter-spacing: 0">24 products · 5 articles</span></h1>
<div role="tablist" style="display: flex; gap: 8px"><button role="tab" aria-selected="true" class="pill on">Products (24)</button><button role="tab" aria-selected="false" class="pill">Journal (5)</button></div>
</div>

<div style="position: sticky; top: 0; background: #fff; padding: 12px 16px; display: flex; gap: 10px; border-bottom: 1px solid #F1E4E8; margin-top: 4px">
<a class="half" href="Mobile-Search-Filter.dc.html"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4"></path></svg>Filter <span style="min-width: 20px; height: 20px; border-radius: 999px; background: #C8325F; color: #fff; font-size: 11px; display: inline-flex; align-items: center; justify-content: center">3</span></a>
<button class="half">Sort: Best match<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
<div style="display: flex; gap: 8px; overflow-x: auto; padding: 12px 16px"><span class="pill" style="background: #FCEEF1; border-color: #FCEEF1">Face serums ✕</span><span class="pill" style="background: #FCEEF1; border-color: #FCEEF1">Dry skin ✕</span><span class="pill" style="background: #FCEEF1; border-color: #FCEEF1">Hyaluronic ✕</span></div>

<section style="padding: 4px 16px 0">
<div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 22px 12px">
<sc-for list="{{items}}" as="p" hint-placeholder-count="6">
<div style="display: flex; flex-direction: column; gap: 10px">
<div class="ph" style="aspect-ratio: 4/5; background: {{p.tint}}"><a href="Mobile-Product.dc.html" aria-label="{{p.name}}" style="position: absolute; inset: 0"></a><sc-if value="{{p.hasBadge}}" hint-placeholder-val="{{true}}"><span class="{{p.badgeClass}}">{{p.badge}}</span></sc-if>
<button class="icb" aria-label="Quick add to bag" style="position: absolute; right: 6px; bottom: 6px; background: #1F1219; color: #fff"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button></div>
<div><div class="mut" style="font-size: 12px">{{p.cat}}</div><a href="Mobile-Product.dc.html" style="font-weight: 600; font-size: 14px; line-height: 1.3">{{p.name}}</a><div style="display: flex; justify-content: space-between; align-items: center; margin-top: 6px"><div style="display: flex; gap: 6px; align-items: baseline"><span class="price">{{p.price}}</span><sc-if value="{{p.hasWas}}" hint-placeholder-val="{{false}}"><span class="was">{{p.was}}</span></sc-if></div><span style="font-size: 12px; font-weight: 600"><span class="stars" aria-hidden="true">★</span> {{p.rating}}</span></div></div>
</div>
</sc-for>
</div>
<a href="Mobile-Home.dc.html" style="margin-top: 24px; display: flex; gap: 12px; align-items: center; padding: 14px; border-radius: 18px; background: #FFF7F8"><span style="width: 64px; height: 64px; border-radius: 14px; background: #E2ECF6; flex: none"></span><span style="display: flex; flex-direction: column; gap: 4px; font-size: 14px"><span style="font-size: 11px; font-weight: 700; letter-spacing: .1em; color: #C8325F">FROM THE JOURNAL</span><strong>How to layer a <mark>serum</mark> in your routine</strong></span></a>
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 28px 0 40px"><span class="mut" style="font-size: 13px">Showing 6 of 24</span><button class="btn" style="width: 100%">Show more</button></div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":1460}}'>
class Component extends DCLogic {
  renderVals() {
    const P = [
      ['Rose Dew Hydrating Serum','Face serum','$28','','4.9','#FBE4EA','Bestseller'],
      ['Vitamin C Brightening Drops','Face serum','$26','$32','4.6','#FAF0D4','Sale'],
      ['Hyaluronic Water Gel Serum','Face serum','$24','','4.7','#E2ECF6',''],
      ['Niacinamide Pore Serum','Face serum','$19','','4.6','#E2EEE5','New'],
      ['Argan Repair Hair Serum','Hair serum','$21','','4.8','#F1E8DF',''],
      ['Peptide Eye Serum','Eye serum','$29','','4.5','#ECE4F6','']
    ].map(([name,cat,price,was,rating,tint,badge]) => ({ name, cat, price, was, hasWas: !!was, rating, tint, badge, hasBadge: !!badge, badgeClass: badge === 'Sale' ? 'badge sale' : 'badge' }));
    return { items: P };
  }
}
</script>
</body>
</html>
